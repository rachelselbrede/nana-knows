name: Deploy Nana Knows to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Queued runs are superseded, but a deploy that has already begun is allowed
# to finish: cancelling deploy-pages mid-flight is the one way this workflow
# could leave the live site in an odd state, and waiting costs a minute.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Nana's arithmetic is checked before anything reaches the live site. The
  # suite has no dependencies of its own, so this needs no install and costs
  # seconds.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
