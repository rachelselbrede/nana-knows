name: Tests

# Deploy runs the same suite before publishing. This workflow is what makes a
# pull request tell you whether Nana's sums still add up, before it is merged.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm test

  # The same smoke run the deploy makes, so a pull request also says whether
  # the page still behaves — not only whether the sums add up.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The linter and the formatter need the install, so they ride along
      # here rather than in the dependency-free job above.
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm run smoke

  # Dependabot's pull requests merge themselves once both jobs above are
  # green, so keeping the tools current is nobody's weekly chore. A major
  # version is left open on purpose: the smoke run reads every word on the
  # page but never colours or geometry, so a major Tailwind or Vite could
  # wreck the look of the site and still pass. Those want a pair of eyes.
  #
  # A merge made with the workflow's own token does not start other workflows,
  # which would leave the merged update sitting on main, undeployed, until the
  # next push. So the deploy is started by hand, which that token may do.
  automerge:
    needs: [test, smoke]
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3
      - if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: |
          gh pr merge --squash "$PR_URL"
          gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
